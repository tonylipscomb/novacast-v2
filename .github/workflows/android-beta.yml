name: Android Beta APK

on:
  push:
    branches:
      - beta-rolling-download
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_ENV: production
  EXPO_PUBLIC_MOVIES_SQLITE_READS: 'true'
  EXPO_PUBLIC_SERIES_SQLITE_READS: 'true'
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'
  EXPO_NO_TELEMETRY: '1'
  CI: 'true'
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  EXPO_PUBLIC_CLOSED_BETA_MODE: 'true'
  EXPO_PUBLIC_DEVICE_REGISTRATION_ENABLED: 'true'
  EXPO_PUBLIC_DEVICE_ACTIVATION_ENABLED: 'true'
  EXPO_PUBLIC_DEVICE_ACTIVATION_REQUIRED: 'true'
  EXPO_PUBLIC_BETA_INVITES_ENABLED: 'true'
  EXPO_PUBLIC_MANAGED_BETA_PROVIDER_ENABLED: 'true'
  EXPO_PUBLIC_PERSONAL_PROVIDER_PAIRING_ENABLED: 'false'

  EXPO_PUBLIC_NOVACAST_PAIRING_API_URL: ${{ secrets.EXPO_PUBLIC_NOVACAST_PAIRING_API_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_NOVACAST_PAIRING_WEBSITE_URL: ${{ secrets.EXPO_PUBLIC_NOVACAST_PAIRING_WEBSITE_URL }}

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version label
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="beta-${GITHUB_RUN_NUMBER}"
          fi

          IS_PRERELEASE=false
          if echo "$VERSION" | grep -Eiq '(beta|alpha|rc)'; then
            IS_PRERELEASE=true
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION} prerelease=${IS_PRERELEASE}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Verify Expo token and pairing env
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub secret EXPO_TOKEN"
            missing=1
          fi

          if [[ -z "${EXPO_PUBLIC_NOVACAST_PAIRING_API_URL:-}" ]]; then
            echo "::error::Missing GitHub secret EXPO_PUBLIC_NOVACAST_PAIRING_API_URL"
            missing=1
          fi

          if [[ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::Missing GitHub secret EXPO_PUBLIC_SUPABASE_ANON_KEY"
            missing=1
          fi

          if [[ -z "${EXPO_PUBLIC_NOVACAST_PAIRING_WEBSITE_URL:-}" ]]; then
            echo "::error::Missing GitHub secret EXPO_PUBLIC_NOVACAST_PAIRING_WEBSITE_URL"
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          npx expo whoami
          echo "Closed-beta configuration is present."

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify production signing configuration
        shell: bash
        env:
          NOVACAST_KEYSTORE_BASE64: ${{ secrets.NOVACAST_KEYSTORE_BASE64 }}
          NOVACAST_KEYSTORE_PASSWORD: ${{ secrets.NOVACAST_KEYSTORE_PASSWORD }}
          NOVACAST_KEY_ALIAS: ${{ secrets.NOVACAST_KEY_ALIAS }}
          NOVACAST_KEY_PASSWORD: ${{ secrets.NOVACAST_KEY_PASSWORD }}
          NOVACAST_RELEASE_CERT_SHA256: ${{ secrets.NOVACAST_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          for name in NOVACAST_KEYSTORE_BASE64 NOVACAST_KEYSTORE_PASSWORD NOVACAST_KEY_ALIAS NOVACAST_KEY_PASSWORD NOVACAST_RELEASE_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production signing secret ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Production signing configuration is incomplete; refusing to build/publish a debug-signed rolling beta."
            exit 1
          fi

      - name: Configure release signing
        shell: bash
        env:
          NOVACAST_KEYSTORE_BASE64: ${{ secrets.NOVACAST_KEYSTORE_BASE64 }}
          NOVACAST_KEYSTORE_PASSWORD: ${{ secrets.NOVACAST_KEYSTORE_PASSWORD }}
          NOVACAST_KEY_ALIAS: ${{ secrets.NOVACAST_KEY_ALIAS }}
          NOVACAST_KEY_PASSWORD: ${{ secrets.NOVACAST_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${NOVACAST_KEYSTORE_PASSWORD:-}" ]] ||
             [[ -z "${NOVACAST_KEY_ALIAS:-}" ]] ||
             [[ -z "${NOVACAST_KEY_PASSWORD:-}" ]]; then
            echo "Production signing configuration is incomplete; refusing to build/publish a debug-signed rolling beta."
            exit 1
          fi

          printf '%s' "$NOVACAST_KEYSTORE_BASE64" |
            base64 --decode > android/app/novacast-release.jks

          node scripts/ci-configure-android-release-signing.mjs

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        env:
          NOVACAST_KEYSTORE_PASSWORD: ${{ secrets.NOVACAST_KEYSTORE_PASSWORD }}
          NOVACAST_KEY_ALIAS: ${{ secrets.NOVACAST_KEY_ALIAS }}
          NOVACAST_KEY_PASSWORD: ${{ secrets.NOVACAST_KEY_PASSWORD }}
        run: ./gradlew app:assembleRelease --no-daemon

      - name: Verify production APK signing and metadata
        shell: bash
        env:
          NOVACAST_RELEASE_CERT_SHA256: ${{ secrets.NOVACAST_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          [[ -f "$APK_PATH" ]] || { echo "::error::Release APK missing"; exit 1; }
          [[ -x "$APKSIGNER" ]] || { echo "::error::apksigner not found"; exit 1; }
          [[ -x "$AAPT" ]] || { echo "::error::aapt not found"; exit 1; }

          CERT_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK_PATH")"
          echo "$CERT_OUTPUT"
          ACTUAL_CERT="$(
            printf '%s\n' "$CERT_OUTPUT" |
            awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}' |
            tr -d ':[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"
          EXPECTED_CERT="$(printf '%s' "$NOVACAST_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ -n "$ACTUAL_CERT" && "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || {
            echo "::error::APK certificate does not match the required production certificate"
            exit 1
          }
          [[ "$ACTUAL_CERT" != "FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C" ]] || {
            echo "::error::Debug certificate detected; refusing to publish"
            exit 1
          }

          BADGING="$($AAPT dump badging "$APK_PATH")"
          echo "$BADGING" | grep -Fq "package: name='com.novacast.novacastv2' versionCode='8' versionName='1.0.4-beta'" || {
            echo "::error::APK package/version metadata mismatch"
            exit 1
          }
          if echo "$BADGING" | grep -Fq "application-debuggable"; then
            echo "::error::APK is debuggable"
            exit 1
          fi
          echo "Production APK signature and metadata verified."

      - name: Package novacast.apk artifacts
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::Release APK missing at ${APK_PATH}"
            exit 1
          fi

          VERSION="${{ steps.meta.outputs.version }}"

          mkdir -p dist

          STABLE_APK="dist/novacast.apk"
          VERSIONED_APK="dist/NovaCast-${VERSION}.apk"
          CHECKSUM_PATH="dist/novacast.apk.sha256"

          cp "$APK_PATH" "$STABLE_APK"
          cp "$APK_PATH" "$VERSIONED_APK"
          sha256sum "$STABLE_APK" | awk '{print $1 "  novacast.apk"}' > "$CHECKSUM_PATH"

          echo "stable_path=${STABLE_APK}" >> "$GITHUB_OUTPUT"
          echo "versioned_path=${VERSIONED_APK}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${CHECKSUM_PATH}" >> "$GITHUB_OUTPUT"
          echo "Packaged novacast.apk + checksum for ${VERSION}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCast-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.apk.outputs.stable_path }}
            ${{ steps.apk.outputs.versioned_path }}
            ${{ steps.apk.outputs.checksum_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish rolling beta download
        if: github.ref == 'refs/heads/beta-rolling-download'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: beta-latest
          STABLE_APK: ${{ steps.apk.outputs.stable_path }}
          CHECKSUM_PATH: ${{ steps.apk.outputs.checksum_path }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$STABLE_APK" \
              "$CHECKSUM_PATH" \
              --clobber
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "NovaCast Beta - Latest"
          else
            gh release create "$TAG" \
              "$STABLE_APK" \
              "$CHECKSUM_PATH" \
              --target "$GITHUB_SHA" \
              --title "NovaCast Beta - Latest" \
              --notes "Rolling NovaCast beta build from the beta-rolling-download branch. novacast.apk is replaced automatically after each successful signed beta build." \
              --prerelease
          fi

          echo "Rolling beta URL:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/novacast.apk"

      - name: Create or update versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          STABLE_APK: ${{ steps.apk.outputs.stable_path }}
          VERSIONED_APK: ${{ steps.apk.outputs.versioned_path }}
          CHECKSUM_PATH: ${{ steps.apk.outputs.checksum_path }}
        run: |
          set -euo pipefail

          PRERELEASE_ARGS=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$STABLE_APK" \
              "$CHECKSUM_PATH" \
              "$VERSIONED_APK" \
              --clobber
          else
            gh release create "$TAG" \
              "$STABLE_APK" \
              "$CHECKSUM_PATH" \
              "$VERSIONED_APK" \
              --title "NovaCast ${TAG}" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}"
          fi

      - name: Remove temporary release keystore
        if: always()
        shell: bash
        run: |
          rm -f android/app/novacast-release.jks
          echo "Temporary keystore cleanup complete."
