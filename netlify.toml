[build]
command = "npm --prefix pairing-web run build"
publish = "pairing-web/dist"

# Permanent APK redirects must appear before the SPA fallback.
[[redirects]]
from = "/downloads/novacast.apk"
to = "https://github.com/tonylipscomb/novacast-v2/releases/download/v1.0.7/novacast.apk"
status = 302
force = true

[[redirects]]
from = "/downloads/novacast.apk.sha256"
to = "https://github.com/tonylipscomb/novacast-v2/releases/download/v1.0.7/novacast.apk.sha256"
status = 302
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

