project_id = "novacast"

[functions.pairing-create]
verify_jwt = true

[functions.pairing-status]
verify_jwt = true

[functions.pairing-submit]
verify_jwt = true

[functions.pairing-redeem]
verify_jwt = true

[functions.pairing-cancel]
verify_jwt = true

# Device endpoints authenticate via x-novacast-device-* headers (plus anon apikey).
[functions.device-register]
verify_jwt = false

[functions.device-activate]
verify_jwt = false

[functions.device-status]
verify_jwt = false

[functions.device-heartbeat]
verify_jwt = false

[functions.analytics-ingest]
verify_jwt = false

[functions.recommendation-events-ingest]
verify_jwt = false

[functions.device-epg]
verify_jwt = false

[functions.device-provider-assignment]
verify_jwt = false

[functions.admin-devices]
verify_jwt = false

[functions.admin-invites]
verify_jwt = false

[functions.admin-device-action]
verify_jwt = false

[functions.admin-providers]
verify_jwt = false

[functions.admin-dashboard]
verify_jwt = false

[functions.admin-commands]
verify_jwt = false

[functions.admin-gold-panel]
verify_jwt = false

[functions.novapulse-sports-refresh]
verify_jwt = false

[functions.novapulse-recommendation-aggregate]
verify_jwt = false

[functions.novapulse-recommendation-candidates]
verify_jwt = false

[functions.novapulse-sports-feed]
enabled = true
verify_jwt = false
import_map = "./functions/novapulse-sports-feed/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/novapulse-sports-feed/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/novapulse-sports-feed/*.html" ]

[functions.admin-novapulse-announcements]
enabled = true
verify_jwt = false
entrypoint = "./functions/admin-novapulse-announcements/index.ts"

[functions.novapulse-announcements-feed]
enabled = true
verify_jwt = false
entrypoint = "./functions/novapulse-announcements-feed/index.ts"

[functions.novapulse-weather-feed]
enabled = true
verify_jwt = false
entrypoint = "./functions/novapulse-weather-feed/index.ts"
